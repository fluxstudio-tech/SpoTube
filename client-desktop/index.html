<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuralVault Desktop</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind'in hızlıca çalışması için CDN kullanıyoruz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'av-yale': '#134074',
              'av-oxford': '#13315C',
              'av-prussian': '#0B2545',
              'av-powder': '#8DA9C4',
              'av-mint': '#EEF4ED',
            },
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              logo: ['"Space Grotesk"', 'sans-serif'],
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite'ye uygulamayı başlatması gereken yeri gösteriyoruz -->
    <script type="module" src="/src/renderer/main.jsx"></script>
  </body>
</html>
